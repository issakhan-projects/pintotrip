# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Every env entry must include either `value` or `secret`.
# Set remaining NEXT_PUBLIC_FIREBASE_* / Maps keys in the Firebase console
# (console values override this file), or add them here with `value:`.
env:
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: pintotrip
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_POSTHOG_KEY
    value: phc_kj69metXdJnTWFoijWdCBfjRbCfDyNzFozBySasfETxj
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_POSTHOG_HOST
    value: https://us.i.posthog.com
    availability:
      - BUILD
      - RUNTIME
